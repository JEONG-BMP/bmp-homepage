<style>

:root{--navy:#0f2347;--navy2:#2c4a77;--gold:#c9a24b;--ink:#1a1a1a;--mut:#6b7280;--line:#d9dee7;--tint:#f4f6fa}

body.zh{font-family:"Microsoft YaHei","PingFang SC","Pretendard",sans-serif}
.bar{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}

.bar .pri{background:var(--gold);border-color:var(--gold);color:#0f2347;font-weight:700}
#st{width:100%;text-align:center;font-size:13px;color:var(--mut)}
#st.ok{color:#15803d}#st.er{color:#b91c1c}
.doc{max-width:820px;margin:24px auto;background:#fff;padding:40px 44px 48px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.head{text-align:center;padding-bottom:16px;margin-bottom:18px;border-bottom:3px double var(--navy)}

.head h1{margin:0;font-size:28px;color:var(--navy);letter-spacing:2px}
.notice{background:var(--tint);border-left:4px solid var(--gold);padding:10px 14px;font-size:14px;margin-bottom:22px}
section{margin-bottom:24px}
h2{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--navy);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);break-after:avoid}
h2 .no{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
h2 .sub{font-size:13px;font-weight:400;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.fd{grid-column:1/3}.fd.h{grid-column:auto}
.lb{display:block;font-size:14px;font-weight:600;color:#2a3445;margin-bottom:3px}
.f{width:100%;border:0;border-bottom:1px solid #aab2c0;font:inherit;background:transparent;padding:4px 2px;outline:0}
.f:focus{background:#fff7d1;border-bottom-color:var(--navy2)}
textarea.f{border:1px solid #c3cad6;border-radius:3px;min-height:100px;padding:8px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px}
.opts label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.opts .x{width:150px}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--navy2)}
.agree{border:1px solid var(--line);background:var(--tint);padding:14px 16px;font-size:14px}.agree p{margin:4px 0}
.rq{color:#dc2626;font-weight:700}.em{color:#dc2626;font-size:13px;font-weight:700;margin-top:4px}.fd.bad{background:#fee2e2;outline:2px solid #fca5a5;border-radius:6px;padding:8px 10px}.fd.bad .f{border-bottom-color:#dc2626}
.foot{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);text-align:center}
@media(max-width:640px){.doc{padding:24px 18px;margin:0}.g{grid-template-columns:1fr}.fd,.fd.h{grid-column:auto}}
@media print{body{background:#fff;font-size:10.5pt}.bar{display:none}.doc{max-width:none;margin:0;padding:0;box-shadow:none}.fd{break-inside:avoid}}

function restore(a){if(!a)return;const e=inputs();if(a.length!=e.length)return;e.forEach((i,n)=>{if(i.type=='radio'||i.type=='checkbox')i.checked=a[n][0];else i.value=a[n][1]})}
function today(){const d=$('[data-k="0_10"]');if(d&&!d.value)d.value=new Date().toLocaleDateString('sv-SE')}
function setLang(n,keep=true){const s=keep?snap():null;L=n;try{localStorage.setItem('bmp_lang',n)}catch(e){}render();restore(s);today()}
const st=(m,c='')=>{const e=$('#st');e.textContent=m;e.className=c};

function collect(){
 let out=[],val={};
 S.forEach((s,si)=>{const lines=[];s[2].forEach((f,fi)=>{
  const k=si+'_'+fi,[ty,lb]=f;let v='';
  if(ty=='n')return;
  if(ty=='r'||ty=='c')v=[...fm.querySelectorAll(`input[name="${k}"]:checked`)].map(i=>{const x=i.parentElement.querySelector('.x');return i.value+(x&&x.value.trim()?` (${x.value.trim()})`:'')}).join(', ');
  else v=fm.querySelector(`[data-k="${k}"]`).value.trim();
  val[k]=v;if(v)lines.push((lb?ko(lb)+': ':'')+v)});
  if(lines.length)out.push(`■ ${ko(s[0])}\n`+lines.join('\n'))});
 return{text:out.join('\n\n'),val};
}
async function submit(){
 if($('#bc').checked)return;
 const{text,val}=collect();
 fm.querySelectorAll('.fd.bad').forEach(x=>{x.classList.remove('bad');x.querySelector('.em').hidden=true});
 const miss=REQ.filter(k=>k=='8_1'?val[k]!='동의함':!val[k]);
 if(miss.length){miss.forEach(k=>{const f=fm.querySelector(`[data-r="${k}"]`);f.classList.add('bad');f.querySelector('.em').hidden=false});
  st(t(U.need),'er');const f=fm.querySelector(`[data-r="${miss[0]}"]`);f.scrollIntoView({behavior:'smooth',block:'center'});const i=f.querySelector('input,textarea');if(i)i.focus({preventScroll:true});return}
 if(CFG.KEY.startsWith('YOUR_')){st('CFG.KEY (Web3Forms Access Key) 미설정 / not configured','er');return}
 st(t(U.send));
 try{
  const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
   body:JSON.stringify({access_key:CFG.KEY,subject:`[상담 사전 설문] ${val['0_0']} (${['KO','EN','ZH'][L]})`,from_name:'bm partners 상담 설문',replyto:val['0_5']||undefined,message:`작성 언어: ${['한국어','English','中文'][L]}\n\n`+text})});
  const j=await r.json();
  if(j.success){sent=true;st(t(U.ok),'ok');try{localStorage.removeItem(KEY)}catch(e){}}else throw 0;
 }catch(e){st(t(U.fail),'er')}
}

document.querySelectorAll('.bar [data-l]').forEach(b=>b.onclick=()=>setLang(+b.dataset.l));
$('#bh').onclick=e=>{if(dirty()&&!confirm(t(U.lv)))e.preventDefault()};
$('#bs').onclick=submit;$('#bp').onclick=()=>window.print();
fm.addEventListener('input',e=>{sent=false;const f=e.target.closest('.fd.bad');if(f&&!(e.target.name=='8_1'&&e.target.value!='동의함')){f.classList.remove('bad');f.querySelector('.em').hidden=true}
 try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}});

(function init(){
 const q=new URLSearchParams(location.search).get('lang');let n;
 try{n=localStorage.getItem('bmp_lang')}catch(e){}
 const m={ko:0,en:1,zh:2};
 L=q in m?m[q]:n!=null?+n:/^zh/i.test(navigator.language)?2:/^ko/i.test(navigator.language)?0:1;
 render();let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}restore(d);today();
})();
</script>
</body>
