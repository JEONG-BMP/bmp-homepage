const REQ=['0_0','0_4','8_1'];
let L=0;const $=s=>document.querySelector(s),fm=$('#fm');
const t=s=>(s.split('|')[L]||s.split('|')[0]),ko=s=>s.split('|')[0];
const KEY='bmp_survey_draft';let sent=false;
const dirty=()=>!sent&&inputs().some(i=>i.type=='checkbox'||i.type=='radio'?i.checked:i.value.trim()&&i.dataset.k!='0_10');

function render(){
 document.documentElement.lang=['ko','en','zh-CN'][L];document.body.className=L==2?'zh':'';
 document.title=t(U.title)+' | bm partners';
 const q=L==2?`<div class="qr"><img src="${QR}" alt="微信二维码">微信扫码咨询</div>`:'';
 let h=`<header class="head${q?' hq':''}"><p>CONSULTATION INTAKE FORM</p><h1>${t(U.title)}</h1>${q}</header><div class="notice">${t(U.note)}<br><span class="rq">*</span> ${t(U.rqn)}<br><small>${t(U.draft)}</small></div>`;
 S.forEach((s,si)=>{
  h+=`<section><h2><span class="no">${si+1}</span>${t(s[0])}${s[1]?`<span class="sub">${t(s[1])}</span>`:''}</h2><div class="g">`;
  s[2].forEach((f,fi)=>{
   const k=si+'_'+fi,[ty,lb,o]=f;let c='';
   if(ty=='n')c=`<div class="agree">${t(o).split('¶').map(x=>`<p>${x}</p>`).join('')}</div>`;
   else if(ty=='a')c=`<textarea class="f" data-k="${k}"></textarea>`;
   else if(ty=='r'||ty=='c')c=`<div class="opts">`+o.map(x=>{const e=x.endsWith('*'),v=e?x.slice(0,-1):x;return `<label><input type="${ty=='r'?'radio':'checkbox'}" name="${k}" value="${ko(v)}">${t(v)}${e?'<input class="f x" type="text">':''}</label>`}).join('')+`</div>`;
   else c=`<input class="f" data-k="${k}" type="${{t:'text',d:'date',p:'tel',e:'email'}[ty]}">`;
   const rq=REQ.includes(k);
   h+=`<div class="fd ${o=='h'?'h':''}" data-r="${k}">${lb?`<label class="lb">${t(lb)}${rq?' <b class="rq">*</b>':''}</label>`:''}${c}${rq?`<div class="em" hidden>${t(k=='8_1'?U.cs:U.req)}</div>`:''}</div>`;
  });
  h+=`</div></section>`;
 });
 fm.innerHTML=h+`<input type="checkbox" id="bc" style="display:none" tabindex="-1" autocomplete="off"><footer class="foot">${t(U.foot)}</footer>`;
 $('#bs').textContent=t(U.sub);$('#bp').textContent=t(U.pdf);$('#bh').textContent=t(U.home);$('#bh').href=CFG.HOME;
 document.querySelectorAll('.bar [data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l==L));
}
const inputs=()=>[...fm.querySelectorAll('input:not(#bc),textarea')];
const snap=()=>inputs().map(i=>[i.checked,i.value]);
function restore(a){if(!a)return;const e=inputs();if(a.length!=e.length)return;e.forEach((i,n)=>{if(i.type=='radio'||i.type=='checkbox')i.checked=a[n][0];else i.value=a[n][1]})}
function today(){const d=$('[data-k="0_10"]');if(d&&!d.value)d.value=new Date().toLocaleDateString('sv-SE')}
function setLang(n,keep=true){const s=keep?snap():null;L=n;try{localStorage.setItem('bmp_lang',n)}catch(e){}render();restore(s);today()}
const st=(m,c='')=>{const e=$('#st');e.textContent=m;e.className=c};

function collect(){
 let out=[],val={};
 S.forEach((s,si)=>{const lines=[];s[2].forEach((f,fi)=>{
  const k=si+'_'+fi,[ty,lb]=f;let v='';
  if(ty=='n')return;
  if(ty=='r'||ty=='c')v=[...fm.querySelectorAll(`input[name="${k}"]:checked`)].map(i=>{const x=i.parentElement.querySelector('.x');return i.value+(x&&x.value.trim()?` (${x.value.trim()})`:'')}).join(', ');
  else v=fm.querySelector(`[data-k="${k}"]`).value.trim();
  val[k]=v;if(v)lines.push((lb?ko(lb)+': ':'')+v)});
  if(lines.length)out.push(`■ ${ko(s[0])}\n`+lines.join('\n'))});
 return{text:out.join('\n\n'),val};
}
async function submit(){
 if($('#bc').checked)return;
 const{text,val}=collect();
 fm.querySelectorAll('.fd.bad').forEach(x=>{x.classList.remove('bad');x.querySelector('.em').hidden=true});
 const miss=REQ.filter(k=>k=='8_1'?val[k]!='동의함':!val[k]);
 if(miss.length){miss.forEach(k=>{const f=fm.querySelector(`[data-r="${k}"]`);f.classList.add('bad');f.querySelector('.em').hidden=false});
  st(t(U.need),'er');const f=fm.querySelector(`[data-r="${miss[0]}"]`);f.scrollIntoView({behavior:'smooth',block:'center'});const i=f.querySelector('input,textarea');if(i)i.focus({preventScroll:true});return}
 if(CFG.KEY.startsWith('YOUR_')){st('CFG.KEY (Web3Forms Access Key) 미설정 / not configured','er');return}
 st(t(U.send));
 try{
  const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
   body:JSON.stringify({access_key:CFG.KEY,subject:`[상담 사전 설문] ${val['0_0']} (${['KO','EN','ZH'][L]})`,from_name:'bm partners 상담 설문',replyto:val['0_5']||undefined,message:`작성 언어: ${['한국어','English','中文'][L]}\n\n`+text})});
  const j=await r.json();
  if(j.success){sent=true;st(t(U.ok),'ok');try{localStorage.removeItem(KEY)}catch(e){}}else throw 0;
 }catch(e){st(t(U.fail),'er')}
}

document.querySelectorAll('.bar [data-l]').forEach(b=>b.onclick=()=>setLang(+b.dataset.l));
$('#bh').onclick=e=>{if(dirty()&&!confirm(t(U.lv)))e.preventDefault()};
$('#bs').onclick=submit;$('#bp').onclick=()=>window.print();
fm.addEventListener('input',e=>{sent=false;const f=e.target.closest('.fd.bad');if(f&&!(e.target.name=='8_1'&&e.target.value!='동의함')){f.classList.remove('bad');f.querySelector('.em').hidden=true}
 try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}});

(function init(){
 const q=new URLSearchParams(location.search).get('lang');let n;
 try{n=localStorage.getItem('bmp_lang')}catch(e){}
 const m={ko:0,en:1,zh:2};
 L=q in m?m[q]:n!=null?+n:/^zh/i.test(navigator.language)?2:/^ko/i.test(navigator.language)?0:1;
 render();let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}restore(d);today();
})();
</script>
